<!doctype html><html><head><meta charset="utf-8"><title>O-view brand preview</title>
<style>
  body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:#fff;color:#222}
  .row{display:flex;align-items:center;gap:32px;padding:28px 36px;flex-wrap:wrap}
  .dark{background:#15161c;color:#eee}
  h3{width:100%;margin:0 0 4px;font-size:13px;letter-spacing:2px;text-transform:uppercase;opacity:.55}
  img{display:block}
  .chip{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;opacity:.7}
  .tray{background:#2b2d36;padding:6px 10px;border-radius:8px;display:flex;align-items:center;gap:8px}
</style></head><body>
  <div class="row">
    <h3>App / tray icon</h3>
    <div class="chip"><img src="o-view-icon.svg" width="128" height="128"><span>128</span></div>
    <div class="chip"><img src="o-view-icon.svg" width="64" height="64"><span>64</span></div>
    <div class="chip"><img src="o-view-icon.svg" width="32" height="32"><span>32</span></div>
    <div class="chip"><div class="tray"><img src="o-view-mark.svg" width="16" height="16"><span style="color:#ddd">Session 72%</span></div><span>16 in tray</span></div>
  </div>
  <div class="row dark">
    <h3>Mark on dark</h3>
    <div class="chip"><img src="o-view-mark.svg" width="120" height="120"><span>120</span></div>
    <div class="chip"><img src="o-view-mark.svg" width="48" height="48"><span>48</span></div>
    <div class="chip"><img src="o-view-mark.svg" width="24" height="24"><span>24</span></div>
  </div>
  <div class="row">
    <h3>Horizontal lockup</h3>
    <img src="o-view-logo.svg" width="420">
  </div>
</body></html>
