# Builds the Linux packages and proves they actually install.
#
# Separate from CI because it is slow — two publishes plus container installs — and it only
# needs to run when the packaging or the Linux head changes. The release workflow (#81)
# calls the same script, so what is verified here is what ships.
#
# What this can establish without a desktop: that the package installs on every target
# distribution, that its dependencies are right, that the files land where they should, and
# that the binary starts and renders. What it cannot: whether an icon appears in a panel.
name: Packaging

on:
  pull_request:
    paths:
      - "packaging/**"
      - "src/O-view.Linux/**"
      - ".github/workflows/packaging.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp"
        default: "0.6.0-dev"

# This workflow builds and install-tests packages; it publishes nothing. Without this block
# it inherits whatever the repository default is, which on a repo that has not been switched
# to the read-only default is a write-capable token — handed to a job that runs a shell
# script from a pull request branch and executes downloaded artifacts inside containers.
permissions:
  contents: read

env:
  VERSION: ${{ github.event.inputs.version || '0.6.0-dev' }}

# Every job here is bounded. Without these, a step that wedges runs to the Actions default
# of six hours: on 2026-08-19 two separate runs sat on the Lintian step for over an hour
# each, and a job's logs are not retrievable while it is still in progress, so the stall was
# invisible from the outside. The numbers are several times each job's observed duration —
# they exist to cap a hang, not to police a slow runner.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            arch: amd64
          - rid: linux-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build package and tarball
        run: |
          chmod +x packaging/linux/build.sh
          ./packaging/linux/build.sh "$VERSION" "${{ matrix.rid }}" dist

      # The payload must be for the architecture the control file claims, or the package
      # installs cleanly and then refuses to run — the worst possible combination.
      - name: The binary is genuinely ${{ matrix.arch }}
        run: |
          mkdir -p probe && dpkg-deb -x dist/o-view_*_${{ matrix.arch }}.deb probe
          file probe/usr/lib/o-view/o-view
          case "${{ matrix.arch }}" in
            amd64) file probe/usr/lib/o-view/o-view | grep -q "x86-64" ;;
            arm64) file probe/usr/lib/o-view/o-view | grep -q "aarch64" ;;
          esac

      - name: Files land where the desktop expects them
        run: |
          dpkg-deb -c dist/o-view_*_${{ matrix.arch }}.deb | tee contents.txt
          for path in \
            ./usr/bin/o-view \
            ./usr/lib/o-view/o-view \
            ./usr/share/applications/o-view.desktop \
            ./usr/share/icons/hicolor/48x48/apps/o-view.png \
            ./usr/share/doc/o-view/copyright
          do
            grep -q " $path\$" contents.txt || { echo "MISSING: $path"; exit 1; }
          done
          echo "--- control ---"
          dpkg-deb -I dist/o-view_*_${{ matrix.arch }}.deb

      - name: Lintian
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lintian

          # Bounded, because on 2026-08-19 this step went from 29 s to over an hour on amd64
          # while the arm64 job sat unchanged at under three minutes -- same runner image,
          # same apt install, no packaging change on either side. Whatever the runner's
          # lintian did there, an unbounded run silently consumed the job's entire budget and
          # the logs were unreachable while it hung, which is the part that cost the time.
          #
          # 15 minutes is roughly thirty times the historical amd64 figure, so this cannot
          # fire on a merely slow run, and a stall now fails with a sentence saying so.
          set +e
          timeout 900 lintian --fail-on error --no-tag-display-limit dist/o-view_*_${{ matrix.arch }}.deb
          STATUS=$?
          set -e

          # Warnings are triaged by a human; errors are not acceptable.
          if [ "$STATUS" -eq 124 ]; then
            echo "lintian did not finish within 15 minutes and was killed — this is the stall the bound exists for, not a package defect"
            exit 1
          elif [ "$STATUS" -ne 0 ]; then
            echo "lintian reported an error"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*

  # The claim worth testing: it installs on every distribution the README will name.
  install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12"]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-amd64
          path: dist

      - name: Install on ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/dist:/dist" ${{ matrix.image }} bash -euxc '
            apt-get update -qq
            # Resolves the declared dependencies; a wrong or over-pinned one fails here.
            apt-get install -y -qq /dist/o-view_*_amd64.deb

            test -x /usr/bin/o-view
            test -f /usr/share/applications/o-view.desktop
            test -f /usr/share/icons/hicolor/48x48/apps/o-view.png

            # Starts, loads ICU and libSkiaSharp, and renders — no display needed. This is
            # the check that catches a missing runtime dependency, which is otherwise only
            # discovered by the first user to try it.
            o-view --samples /tmp/icons
            test "$(ls /tmp/icons/*.png | wc -l)" -gt 0

            # Reports what it sees rather than crashing when there is no session bus.
            o-view --probe

            # Removal must leave the user data alone: the weekly-reset log is
            # unrebuildable and costs a week to re-observe (ADR-0011).
            mkdir -p /root/.local/share/O-view && echo keep > /root/.local/share/O-view/weekly-resets.json
            apt-get purge -y -qq o-view
            test -f /root/.local/share/O-view/weekly-resets.json
            test ! -e /usr/lib/o-view
            echo "OK: installs, runs, and purge left user data intact"
          '

  # Every job above installs onto a clean image, which is the one thing no real user after
  # the first release ever does. This one upgrades.
  #
  # What it guards is not the binary — dpkg replaces that — but the three files in
  # ~/.local/share/O-view that outlive the package. The weekly-reset log is the one that
  # matters: it cannot be rebuilt from anything on disk and costs a week to re-observe
  # (ADR-0011), so losing it once is unrecoverable in a way losing the rollup store is not.
  #
  # build.sh deliberately ships no maintainer scripts, so today the data survives by
  # construction. That is exactly why this is worth pinning: the property is currently held
  # up by the absence of code, and nothing fails if someone later adds a postrm that tidies
  # up after itself. The comment in build.sh saying not to is the only thing standing there.
  #
  # Run across the full matrix rather than one image, because the upgrade re-resolves
  # Depends — and the ICU and OpenSSL alternatives differ on every one of these releases.
  upgrade:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12"]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-amd64
          path: dist

      - name: Upgrade over a previous version on ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/dist:/dist" ${{ matrix.image }} bash -euxc '
            apt-get update -qq

            # "The previous version" is the package under test, repacked with a lower version
            # number. Synthesised rather than downloaded from the releases page so the test
            # stays hermetic: no network, nothing that breaks when an old asset is renamed,
            # and it still works on a branch that has never been released. The upgrade TARGET
            # is the real built artifact, which is the half that has to be right.
            NEW_VERSION="$(dpkg-deb -f /dist/o-view_*_amd64.deb Version)"
            mkdir -p /tmp/prev
            dpkg-deb -R /dist/o-view_*_amd64.deb /tmp/prev
            sed -i "s/^Version: .*/Version: 0.0.1-previous/" /tmp/prev/DEBIAN/control
            # -Znone: this package is installed once and thrown away, so re-compressing a
            # self-contained .NET payload three times over would be the slowest step here for
            # no benefit.
            dpkg-deb -Znone --root-owner-group --build /tmp/prev /tmp/prev.deb

            apt-get install -y -qq /tmp/prev.deb
            dpkg -s o-view | grep -qx "Version: 0.0.1-previous"

            # State a real install accrues. Written after the old version is in place, so the
            # upgrade meets them exactly as it would on a machine that has been running for
            # weeks. usage.db is opaque bytes on purpose: what is being tested is that dpkg
            # leaves the file alone, not anything about its contents.
            mkdir -p /root/.local/share/O-view
            printf "%s" "{\"NotifyOnThreshold\":false,\"ThresholdPercent\":42,\"LastUpdateNoticeTag\":\"v0.0.1\"}" \
              > /root/.local/share/O-view/settings.json
            printf "%s" "the-observed-weekly-reset-that-costs-a-week-to-re-observe" \
              > /root/.local/share/O-view/weekly-resets.json
            head -c 4096 /dev/urandom > /root/.local/share/O-view/usage.db
            sha256sum /root/.local/share/O-view/settings.json \
                      /root/.local/share/O-view/weekly-resets.json \
                      /root/.local/share/O-view/usage.db > /tmp/before.sha256

            # The upgrade itself, through apt so dependency re-resolution is exercised too.
            apt-get install -y -qq /dist/o-view_*_amd64.deb

            # The new version is the one installed, and it is fully configured rather than
            # left half-unpacked -- which is what a failing maintainer script would look like.
            dpkg -s o-view | grep -qx "Version: $NEW_VERSION"
            dpkg -s o-view | grep -qx "Status: install ok installed"

            # The point of the whole job: all three files byte-identical across the upgrade.
            sha256sum -c /tmp/before.sha256

            # And the upgraded install is not merely present but working — a preserved
            # weekly-reset log is no use behind a binary that will not start.
            test -x /usr/bin/o-view
            o-view --samples /tmp/icons
            test "$(ls /tmp/icons/*.png | wc -l)" -gt 0
            echo "OK: upgrade preserved settings, rollup store and weekly-reset log"
          '

  # arm64 through emulation. Slower and only a smoke test, but it is the difference between
  # "we built an arm64 payload" and "an arm64 payload runs".
  install-arm64:
    needs: build
    runs-on: ubuntu-latest
    # The most generous bound here: everything inside runs through QEMU.
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-arm64
          path: dist
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Install and run under arm64 emulation
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD/dist:/dist" ubuntu:24.04 bash -euxc '
            apt-get update -qq
            apt-get install -y -qq /dist/o-view_*_arm64.deb
            test -x /usr/bin/o-view
            o-view --samples /tmp/icons
            test "$(ls /tmp/icons/*.png | wc -l)" -gt 0
            echo "OK: arm64 package installs and runs"
          '

  tarball:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-amd64
          path: dist

      # The portable path, for distributions the .deb does not target. Deliberately tested
      # on one that is NOT Debian-family, since that is the whole reason it exists.
      - name: Extract and run on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist" fedora:latest bash -euxc '
            dnf install -y -q tar libicu openssl libX11 fontconfig >/dev/null
            mkdir -p /opt/ov && tar -xzf /dist/o-view-*-linux-x64.tar.gz -C /opt/ov --strip-components=1
            # The execute bit must survive the archive — a tarball built on Windows loses it.
            test -x /opt/ov/o-view
            /opt/ov/o-view --samples /tmp/icons
            test "$(ls /tmp/icons/*.png | wc -l)" -gt 0
            echo "OK: tarball extracts and runs outside the .deb target"
          '
